
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word and Character Counter</title>
</head>
<body>

    <h1>Word and Character Counter</h1>

    <p>
        Enter your text below to analyze words,
        characters, sentences, and paragraphs.
    </p>

    <h2>Enter Your Text</h2>

    <textarea id="textInput" rows="10" cols="50"
        placeholder="Type or paste your text here..."></textarea>

    <h3>Upload a Text File</h3>
    <input type="file" id="fileInput" accept=".txt">

    <h2>Text Analysis</h2>

    <button onclick="analyzeText()">Analyze Text</button>
    <button onclick="clearText()">Clear Text</button>

    <h3>Results</h3>

    <p>Words: <span id="wordCount">0</span></p>
    <p>Characters: <span id="charCount">0</span></p>
    <p>Sentences: <span id="sentenceCount">0</span></p>
    <p>Paragraphs: <span id="paragraphCount">0</span></p>

    <script src="script.js"></script>

</body>
</html>
